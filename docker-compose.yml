services:
  api:
    build: ./server
    ports:
      - "3000:3000"
    env_file: ./server/.env
    depends_on:
      - mongo
      - mailhog
    volumes:
      - ./server/src:/app/src
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/src

  web:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - api
    volumes:
      - ./client/src:/app/src
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
